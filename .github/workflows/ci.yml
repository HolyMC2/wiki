
name: CI

on:
  push:
    branches:
      - doco-pin
    paths-ignore:
      - '**.js'
      - '**.vue'
      - '**.css'
      - '**.ts'
  pull_request:
    paths-ignore:
      - '**.js'
      - '**.vue'
      - '**.css'
      - '**.ts'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
    name: Server

    services:
      redis-cache:
        image: redis:alpine
        ports:
          - 13000:6379
      redis-queue:
        image: redis:alpine
        ports:
          - 11000:6379
      mariadb:
        image: mariadb:10.6
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: --health-cmd="mariadb-admin ping" --health-interval=5s --health-timeout=2s --health-retries=3

    steps:
      - name: Clone
        uses: actions/checkout@v4

      - name: Find tests
        run: |
          echo "Finding tests"
          grep -rn "def test" > /dev/null

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          check-latest: true

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/*requirements.txt', '**/pyproject.toml', '**/setup.py', '**/setup.cfg') }}
          restore-keys: |
            ${{ runner.os }}-pip-
            ${{ runner.os }}-

      - name: Get yarn cache directory path
        id: yarn-cache-dir-path
        run: 'echo "dir=$(yarn cache dir)" >> $GITHUB_OUTPUT'

      - uses: actions/cache@v4
        id: yarn-cache
        with:
          path: ${{ steps.yarn-cache-dir-path.outputs.dir }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install MariaDB Client
        run: sudo apt update && sudo apt-get install mariadb-client

      - name: Setup
        run: |
          pip install frappe-bench
          # The fork deploys on Frappe 16; bench's default (develop) is not it.
          bench init --skip-redis-config-generation --skip-assets --frappe-branch version-16 --python "$(which python)" ~/frappe-bench
          mariadb --host 127.0.0.1 --port 3306 -u root -proot -e "SET GLOBAL character_set_server = 'utf8mb4'"
          mariadb --host 127.0.0.1 --port 3306 -u root -proot -e "SET GLOBAL collation_server = 'utf8mb4_unicode_ci'"

      - name: Install
        working-directory: /home/runner/frappe-bench
        run: |
          bench get-app wiki $GITHUB_WORKSPACE
          bench setup requirements --dev
          bench new-site --db-root-password root --admin-password admin test_site
          bench --site test_site install-app wiki
          bench build
        env:
          CI: 'Yes'

      - name: Run Tests
        working-directory: /home/runner/frappe-bench
        run: |
          bench --site test_site set-config allow_tests true
          bench --site test_site run-tests --app wiki
        env:
          TYPE: server

  undefined-names:
    # UNDEFINED-NAME GATE (logging audit G18, 2026-09-13). Narrow on purpose:
    # E9 (syntax / IO errors), F63 (comparisons that never hold), F7
    # (statement misuse, F722 included), F82 + F821 (undefined names).
    # Deliberately NOT this repo's full ruff config: gating on that is red on
    # arrival over import-order and unused-noqa trivia, and a check that is
    # always red teaches people to merge past it. This selection is the one
    # that earned its place — it is what caught
    # `posawesome.set_batch_nos_for_bundels`, a `safe_log` call whose import
    # never came with it, and a guest endpoint calling a `validate_token` that
    # no longer exists: live NameErrors no test reached.
    #
    # per-file-ignores is limited to DocType controllers AND to the two codes
    # frappe's GENERATED type block produces. ruff does not resolve
    # `frappe.types.DF.Literal` to `typing.Literal`, so it reads every option
    # string as a forward annotation: a bare word becomes F821, a phrase with
    # a space becomes F722. There are 19 such hits here (15 F821 + 4 F722).
    # Every one of them sits between `# begin: auto-generated types` and `#
    # end: auto-generated types`, and there are ZERO real undefined names
    # outside those markers (measured 2026-09-13). Outside DocType controllers
    # both codes still fail the build, which is the whole point of keeping the
    # ignore path-scoped.
    name: Undefined names (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Clone
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install ruff
        # Pinned: a floating ruff turns a new rule or a parser change into
        # a surprise failure on an unrelated pull request.
        run: python -m pip install ruff==0.14.14

      - name: Check for undefined names
        # --isolated so the gate keeps meaning the same thing whatever a
        # later edit does to [tool.ruff] in pyproject; --no-cache because
        # a warm ruff cache buys nothing on a single-shot runner. The two
        # --per-file-ignores are not one comma-joined value on purpose:
        # ruff's CLI takes exactly one <pattern>:<code> per flag and
        # rejects the pair (measured with ruff 0.14.14).
        run: |
          python -m ruff check --no-cache --isolated \
            --select E9,F63,F7,F82,F821 \
            --per-file-ignores '**/doctype/**/*.py:F821' \
            --per-file-ignores '**/doctype/**/*.py:F722' \
            wiki
